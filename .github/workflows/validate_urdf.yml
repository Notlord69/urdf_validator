name: URDF validation

on:
  push:
    paths:
      - '**.urdf'
      - '**.xacro'
      - 'urdf_validator_main/**'
      - 'pyproject.toml'
  pull_request:
    paths:
      - '**.urdf'
      - '**.xacro'
      - 'urdf_validator_main/**'
      - 'pyproject.toml'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install with dev extras
        run: pip install -e ".[full,dev]"

      - name: Run tests
        run: pytest tests/ --ignore=tests/test_mujoco_validation.py -q

  validate-reference-urdfs:
    name: Validate reference URDFs
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -e ".[full]"

      - name: Validate all six reference URDFs
        run: |
          set -e
          mkdir -p /tmp/urdf-reports
          for urdf in \
            tests/sample_urdf/TurtleBot3.urdf \
            tests/sample_urdf/fetch.urdf \
            tests/sample_urdf/ANYmal.urdf \
            tests/sample_urdf/Spot.urdf \
            tests/sample_urdf/Franka_Panda.urdf \
            tests/sample_urdf/PR2.urdf; do
            echo "=== $(basename $urdf) ==="
            # Exit code 2 means FAIL/UNKNOWN — treat as CI failure.
            # Exit code 0 (PASS) or 1 (WARN) are acceptable.
            urdf_validate "$urdf" --output-dir /tmp/urdf-reports
            code=$?
            if [ $code -eq 2 ]; then
              echo "FAIL: $urdf exited with code 2"
              exit 1
            fi
          done

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urdf-validation-reports
          path: /tmp/urdf-reports/*.json
          retention-days: 30
